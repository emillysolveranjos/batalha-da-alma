<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batalha da Alma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #fff; font-family: VT323, monospace; user-select: none; }
      #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.35; }
      #stage { position: relative; }
      #canvas { display: block; touch-action: none; }
      #monster { position: absolute; left: 50%; transform: translateX(-50%); bottom: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
      #monster img { image-rendering: pixelated; object-fit: contain; animation: bob 2.4s ease-in-out infinite; }
      #monster .placeholder { color: #fff; opacity: 0.8; }
      @keyframes bob { 50% { transform: translateY(-4px); } }
      #layer { position: absolute; left: 0; top: 0; pointer-events: none; }
      #bubble { position: absolute; background: #fff; color: #000; border-radius: 10px; padding: 8px 12px; font-size: 22px; line-height: 1; white-space: pre-wrap; display: none; }
      #bubble::before { content: ""; position: absolute; left: -12px; top: 18px; border: 7px solid transparent; border-right: 7px solid #fff; border-right-width: 12px; border-left-width: 0; }
      #focus { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); font-size: 28px; cursor: pointer; z-index: 5; }
      #note { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: center; gap: 8px; padding: 10px; z-index: 4; }
      #note input { width: min(420px, 70vw); font: 22px VT323, monospace; background: #000; color: #fff; border: 2px solid #fff; padding: 4px 8px; }
      #note button, #top button { font: 20px VT323, monospace; background: #000; color: #ff7f27; border: 2px solid #ff7f27; padding: 2px 10px; cursor: pointer; }
      #top { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 6; }
      #help { position: absolute; top: 8px; left: 10px; font-size: 18px; opacity: 0.6; z-index: 6; }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <div id="wrap">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="layer">
          <div id="monster"></div>
          <div id="bubble"></div>
        </div>
      </div>
    </div>
    <div id="help"></div>
    <div id="top">
      <button id="mute" title="Som">♪</button>
      <button id="close" title="Fechar">✕</button>
    </div>
    <div id="focus">Clique aqui (ou aperte um botão do controle) para jogar</div>
    <div id="note">
      <input id="noteInput" maxlength="120" placeholder="O que você faz? (opcional) — Enter ou A no controle envia" />
      <button id="noteSend">Enviar</button>
    </div>
    <script type="module" src="/src/battle.ts"></script>
  </body>
</html>
